<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Image Mapper</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
  .card img { width: 200px; border-radius: 4px; border: 1px solid #ddd; }
  .card p { font-weight: bold; margin-top: 10px; color: #333; }
</style>
</head>
<body>
<h1 style="text-align:center;">Image Mapper Helper</h1>
<p style="text-align:center;">Look at the images below and tell Antigravity which filename belongs to which section of the guide!</p>
<div class="grid">
  <script>
    for (let i = 1; i <= 20; i++) {
      let num = i.toString().padStart(2, '0');
      document.write(`
        <div class="card">
          <img src="APP_PHOTOS/step_${num}.jpeg" alt="step_${num}.jpeg" loading="lazy">
          <p>step_${num}.jpeg</p>
        </div>
      `);
    }
  </script>
</div>
</body>
</html>
